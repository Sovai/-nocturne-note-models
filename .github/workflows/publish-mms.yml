name: Publish verified MMS Khmer model
on:
  push:
    paths:
      - .github/workflows/publish-mms.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable model release version (e.g. v1)"
        required: true
        default: v1
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Mirror upstream ONNX model and tokens
        env:
          VERSION: ${{ inputs.version || 'v1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mms-khm-$VERSION"
          mkdir -p staging
          curl --fail --location --retry 4 --retry-delay 3 -o staging/model.onnx \
            https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/main/khm/model.onnx
          curl --fail --location --retry 4 --retry-delay 3 -o staging/tokens.txt \
            https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/main/khm/tokens.txt
          test "$(stat -c %s staging/model.onnx)" -gt 20000000
          test "$(stat -c %s staging/tokens.txt)" -gt 50
          sha256sum staging/model.onnx staging/tokens.txt > staging/SHA256SUMS
          gh release create "$tag" staging/model.onnx staging/tokens.txt staging/SHA256SUMS \
            --title "MMS Khmer $VERSION" --notes "Mirrored from willwade/mms-tts-multilingual-models-onnx. Meta MMS weights retain CC BY-NC 4.0; see upstream model card. Checksums attached."
      - name: Publish verified manifest
        env:
          VERSION: ${{ inputs.version || 'v1' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          base="https://github.com/Sovai/-nocturne-note-models/releases/download/mms-khm-"+os.environ["VERSION"]
          def asset(name):
              content=pathlib.Path("staging",name).read_bytes()
              return {"url":base+"/"+name,"sha256":hashlib.sha256(content).hexdigest(),"size":len(content)}
          path=pathlib.Path("catalog.json")
          data=json.loads(path.read_text())
          model=next(m for m in data["models"] if m["id"]=="mms-khm")
          model["status"]="available"
          releases=[r for r in model["releases"] if r.get("version") != os.environ["VERSION"]]
          releases.append({"version":os.environ["VERSION"],"files":{"model.onnx":asset("model.onnx"),"tokens.txt":asset("tokens.txt")}})
          model["releases"]=releases
          path.write_text(json.dumps(data,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "models: publish MMS Khmer $VERSION"
          git push
