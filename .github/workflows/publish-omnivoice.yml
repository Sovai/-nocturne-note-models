name: Publish OmniVoice ONNX INT4 files

on:
  push:
    paths:
      - .github/workflows/publish-omnivoice.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnivoice-onnx-model-release
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face download client
        run: python -m pip install --upgrade huggingface_hub hf_xet
      - name: Download exact mobile ONNX assets and compute integrity manifest
        run: |
          set -euo pipefail
          hf download onnx-community/OmniVoice-Onnx \
            --include 'int4/*' 'audio_tokenizer/fp16/*' \
            --local-dir staging
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json, shutil
          base=Path("staging")
          sources=[
            "int4/audio_embeddings_encoder.onnx",
            "int4/audio_embeddings_encoder.onnx.data",
            "int4/audio_heads_decoder.onnx",
            "int4/chat_template.jinja",
            "int4/config.json",
            "int4/genai_config.json",
            "int4/llm_decoder.onnx",
            "int4/llm_decoder.onnx.data",
            "int4/model_config.json",
            "int4/omnivoice_manifest.json",
            "int4/tokenizer.json",
            "int4/tokenizer_config.json",
            "audio_tokenizer/fp16/acoustic_encoder.onnx",
            "audio_tokenizer/fp16/acoustic_encoder.onnx.data",
            "audio_tokenizer/fp16/higgs_decoder.onnx",
            "audio_tokenizer/fp16/higgs_decoder.onnx.data",
            "audio_tokenizer/fp16/model_config.json",
            "audio_tokenizer/fp16/quantizer_encoder.onnx",
            "audio_tokenizer/fp16/semantic_encoder.onnx",
            "audio_tokenizer/fp16/semantic_encoder.onnx.data",
          ]
          outputs=Path("release_assets")
          outputs.mkdir(exist_ok=True)
          manifest={}
          total=0
          for name in sources:
            p=base/name
            assert p.is_file() and p.stat().st_size>0, f"Missing {name}"
            filename=name.replace("/","__")
            shutil.copyfile(p, outputs/filename)
            checksum=sha256()
            with open(p,"rb") as stream:
              for block in iter(lambda:stream.read(1024*1024),b""):
                checksum.update(block)
            size=p.stat().st_size
            total+=size
            manifest[name]={"asset":filename,"sha256":checksum.hexdigest(),"size":size}
          assert 650_000_000 < total < 1_400_000_000, f"Unexpected total: {total}"
          Path("release_manifest.json").write_text(json.dumps(manifest,indent=2))
          print(f"Verified {len(manifest)} files; total {total} bytes")
          PY
      - name: Create the public release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=omnivoice-onnx-int4-v1
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release_assets/* --clobber
          else
            gh release create "$tag" release_assets/* \
              --title "OmniVoice ONNX INT4 · experimental model files v1" \
              --notes "Mirrored from onnx-community/OmniVoice-Onnx (Apache-2.0). IMPORTANT: downloadable model files only; Android end-to-end OmniVoice synthesis is not yet validated. These weights are not bundled in the Nocturne Note APK."
          fi
      - name: Update downloadable model catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("catalog.json")
          catalog=json.loads(p.read_text())
          entry=next(x for x in catalog["models"] if x["id"]=="omnivoice-onnx-int4")
          files=json.loads(Path("release_manifest.json").read_text())
          base="https://github.com/Sovai/-nocturne-note-models/releases/download/omnivoice-onnx-int4-v1"
          normalized={name:{"url":base+"/"+a["asset"],"sha256":a["sha256"],"size":a["size"]} for name,a in files.items()}
          entry["status"]="available"
          entry["playback_status"]="experimental-not-yet-supported"
          entry["releases"]=[{"version":"v1","files":normalized}]
          p.write_text(json.dumps(catalog,indent=2)+"\n")
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json
          git diff --cached --quiet || (git commit -m "models: publish verified OmniVoice INT4 v1 files" && git push)
